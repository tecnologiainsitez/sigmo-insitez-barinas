name: Compilar SIGMO INSITEZ BARINAS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck & Lint
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

      - name: Upload Build Artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: sigmo-insitez-dist
          path: dist/
          retention-days: 30
